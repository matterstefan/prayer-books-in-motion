name: Harvest MEI corpus

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test access first, then choose full for the corpus'
        type: choice
        default: test
        options:
          - test
          - full

permissions:
  contents: read

concurrency:
  group: harvest-mei-corpus
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - name: Restore completed MEI queries
        uses: actions/cache/restore@v6
        with:
          path: data/cache/mei-corpus
          key: mei-corpus-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mei-corpus-v1-
      - name: Build selection from source tables
        run: python3 scripts/build_corpus.py
      - name: Fetch and transform corpus
        env:
          CERL_USER_AGENT: ${{ secrets.CERL_USER_AGENT }}
          HARVEST_MODE: ${{ inputs.mode }}
        run: |
          if [ "$HARVEST_MODE" = "test" ]; then
            python3 -u scripts/fetch_mei_corpus.py --smoke-test
          elif [ "$HARVEST_MODE" = "full" ]; then
            timeout --signal=INT --kill-after=60s 80m python3 -u scripts/fetch_mei_corpus.py --seed-pilot
          else
            echo "Choose test or full."
            exit 1
          fi
      - name: Save completed queries, including after a partial run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/cache/mei-corpus
          key: mei-corpus-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Make results and checkpoints downloadable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mei-corpus-results
          path: |
            data/expanded/
            data/cache/mei-corpus/
            data/derived/gw-istc-links.csv
            data/derived/prayer-book-corpus.csv
          retention-days: 90
          if-no-files-found: error
